<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>편성 오락실</title>
<style>
@font-face{font-family:"87MM일상";src:url("fonts/87MMILSANG-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"HsSummerWaterLight";src:url("fonts/HSSummer.woff") format("woff");font-display:swap}
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#2b2a27;--sub:#8a877f;--faint:#aaa69c;--line:#e7e4dc;--hover:#efece4;
  --accent:#2b2a27;--accent-soft:#eceae4;--ok:#55705f;--ok-bg:#eaeeeb;--no:#a26056;--no-bg:#f1e9e7;--warn:#97804f;
  --heat:162,96,86;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1B18;--card:#26231E;--ink:#EDE8DF;--sub:#9C9486;--faint:#7b746a;--line:#37332C;--hover:#2E2B25;
  --accent:#EDE8DF;--accent-soft:#33302a;--ok:#8fa398;--ok-bg:#262b28;--no:#c29188;--no-bg:#322724;--warn:#b3a077;
  --heat:194,145,136;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1B18;--card:#26231E;--ink:#EDE8DF;--sub:#9C9486;--faint:#7b746a;--line:#37332C;--hover:#2E2B25;
  --accent:#EDE8DF;--accent-soft:#33302a;--ok:#8fa398;--ok-bg:#262b28;--no:#c29188;--no-bg:#322724;--warn:#b3a077;
  --heat:194,145,136;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"87MM일상",-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.6;word-break:keep-all;padding:0 16px 40px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
.ico{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.2em}
header{display:flex;align-items:center;gap:10px;padding:22px 0 14px}
header h1{font-family:"HsSummerWaterLight","87MM일상",serif;font-weight:normal;font-size:1.7rem;letter-spacing:.06em;flex:1;line-height:1.2}
.tbtn{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.tbtn[aria-pressed="true"]{color:var(--ink)}
h2{font-size:.95rem;color:var(--sub);font-weight:700;margin:18px 0 8px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.mode{display:grid;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--ink)}
.mode.main{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.main .d,.mode.main .best,.mode.main .best strong{color:var(--bg);opacity:.85}
.mode.main b{font-size:1.25rem}
.dacc{height:24px;width:var(--cw,46px);border:0;background:none;font-size:.78rem;color:var(--ink);opacity:.2;padding:0}
.dacc.on{opacity:1;font-weight:700}.dacc.bad{opacity:1;color:var(--no);text-decoration:underline wavy}
.cell.cur{box-shadow:inset 0 0 0 3px var(--ink);background:var(--hover)}
.pal .kk{font-size:.7rem;color:var(--faint);margin-left:2px;font-variant-numeric:tabular-nums}
.keys{font-size:.78rem;color:var(--sub);text-align:center;margin-top:8px}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cap{font-size:.8rem;color:var(--sub);text-align:center;margin:12px 0 2px}
.score5{background:#fff;border-radius:10px;padding:4px 6px;overflow-x:auto;margin:4px 0 6px}
.score5 svg{display:block;margin:0 auto;max-width:100%;height:auto}
form.tin{display:flex;gap:8px;margin-top:12px}
form.tin input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
form.tin input:focus{outline:none;border-color:var(--ink)}
.legend{font-size:.82rem;color:var(--sub);margin-top:8px;line-height:1.7}
.legend b{color:var(--ink)}
details.leg{margin-top:8px;font-size:.85rem;color:var(--sub)}
details.leg summary{cursor:pointer}
.tbook{font-size:.85rem;color:var(--sub);text-align:center;margin-top:4px}
.mode b{font-size:1.08rem}
.mode .d{font-size:.85rem;color:var(--sub)}
.mode .best{font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums;margin-top:6px}
.mode .best strong{color:var(--ink)}
.mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:6px}
.ms{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.ms span:last-child{font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.ms.h1{background:rgba(var(--heat),.12)}.ms.h2{background:rgba(var(--heat),.26)}.ms.h3{background:rgba(var(--heat),.42)}
.ms.good span:last-child{color:var(--ok);font-weight:700}
/* 플레이 */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 10px;font-variant-numeric:tabular-nums}
.hud .quit{border:0;background:none;color:var(--sub);display:inline-flex;align-items:center;gap:4px;font-size:.9rem}
.hud .mn{font-weight:700}
.hud .sp{flex:1}
.hearts{display:inline-flex;gap:2px;color:var(--no)}
.hearts .off{color:var(--line)}
.score{font-weight:700;font-size:1.1rem}
.combo{font-size:.85rem;font-weight:700;color:var(--bg);background:var(--ink);border-radius:999px;padding:1px 10px;visibility:hidden}
.combo.on{visibility:visible;animation:pop .25s}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.timer{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--ink);width:100%;transform-origin:left}
.timer.low i{background:var(--no)}
.prog{font-size:.85rem;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.ask{font-size:1.15rem;font-weight:700;margin-bottom:12px;text-wrap:balance}
.ask small{display:block;font-size:.85rem;font-weight:400;color:var(--sub)}
.bw{overflow-x:auto;padding:2px 2px 8px}
.board{display:grid;width:max-content;margin:0 auto}
.acc{height:22px;font-size:.78rem;text-align:center;color:var(--ink)}
.cell{position:relative;width:var(--cw,46px);height:var(--cw,46px);display:grid;place-items:center;background:var(--card);border:0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);border-left:1.5px dotted var(--sub);padding:0}
.cell.bs{border-left:2px solid var(--ink)}.cell.last{border-right:2px solid var(--ink)}
.cell svg{width:76%;height:76%}
.cell.hide{background:var(--accent-soft)}
.cell.hide::after{content:"?";position:absolute;font-weight:700;color:var(--sub)}
.cell.hide.filled::after{content:none}
.cell.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.cell.tap{cursor:pointer}.cell.tap:hover{background:var(--hover)}
.cell.right{background:var(--ok-bg);box-shadow:inset 0 0 0 3px var(--ok)}
.cell.wrong{background:var(--no-bg);box-shadow:inset 0 0 0 3px var(--no)}
.cell.hit{background:var(--accent-soft)}
.lb{font-size:.66rem;color:var(--sub);text-align:center;padding-top:3px;white-space:nowrap;min-height:1.3em;width:var(--cw,46px);overflow:visible;letter-spacing:-.04em}
.cell{margin:0;box-sizing:border-box}.board{gap:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;text-align:left;min-height:52px}
.opt:hover{border-color:var(--ink)}
.opt .k{font-size:.75rem;color:var(--faint);font-variant-numeric:tabular-nums;min-width:1em}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.opt:disabled{cursor:default}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center}
.pal button{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:4px 12px 4px 6px;font-size:.9rem;white-space:nowrap}
.pal button svg{width:28px;height:28px}
.pal button:hover{border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-weight:700;white-space:nowrap}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.play{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin:6px auto 0;background:var(--ink);color:var(--bg);border:0}
.play svg{width:40px;height:40px}
.play.beat{animation:beat .12s}
@keyframes beat{0%{transform:scale(1.08)}100%{transform:scale(1)}}
.fb{margin-top:14px;text-align:center;font-weight:700;min-height:1.6em}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.fb .sub{display:block;font-weight:400;color:var(--sub);font-size:.85rem}
.big{font-size:2.6rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.stats{display:flex;justify-content:center;gap:18px;color:var(--sub);font-size:.9rem;margin:6px 0 4px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--ink)}
.newbest{text-align:center;font-weight:700;color:var(--warn)}
.rv{margin-top:12px}
.rv .t{font-weight:700;margin-bottom:4px}
.rv .src{font-size:.78rem;color:var(--sub);margin-top:2px}
.rvitem{border-top:1px solid var(--line);padding:12px 0}
.mini{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-size:.8rem;margin-left:6px;vertical-align:1px}
@media (max-width:520px){.card{padding:14px 12px}.big{font-size:2.2rem}}
@media (prefers-reduced-motion:reduce){.combo.on,.play.beat{animation:none}}

.qhd{font-size:.85rem;color:var(--sub)}
.qbig{font-size:1.35rem;font-weight:700;margin:2px 0 12px;text-wrap:balance}
form.inp{display:flex;gap:8px;margin-top:10px}
form.inp input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
form.inp input:focus{outline:none;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;padding:8px;border:1.5px dashed var(--line);border-radius:12px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}
.chip .n{font-size:.78rem;color:var(--sub);font-variant-numeric:tabular-nums}
.chip button{border:0;background:none;color:var(--sub);padding:0 0 0 2px;line-height:1}
.chip.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chip.wrong{background:var(--no-bg);border-color:var(--no);color:var(--no);text-decoration:line-through}
.chip.miss{background:none;border:1.5px dashed var(--no);color:var(--no)}
.chip.opt{border-style:dotted}
.chip.tap{cursor:pointer}.chip.tap:hover{border-color:var(--ink)}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:.78rem;color:var(--sub);margin-top:6px}
.note{font-size:.85rem;color:var(--sub);text-align:center;margin-top:6px}
.qimg{display:block;max-width:100%;height:auto;background:#fff;border-radius:8px;margin:4px auto 8px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px;margin-top:16px}
.bin{min-height:64px;font-weight:700;font-size:1.05rem;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.bin:hover{border-color:var(--ink)}
.bin.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.bin.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.drop{font-size:1.8rem;font-weight:700;text-align:center;padding:10px 0 4px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--sub);margin-top:10px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:54px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-top:6px}
.tray.over,.bbin.over{border-color:var(--ink);background:var(--hover)}
.bbins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin-top:12px}
.bbin{border:1.5px solid var(--line);border-radius:12px;padding:8px;min-height:120px;background:var(--bg);cursor:pointer}
.bbin h4{font-size:.92rem;text-align:center;margin-bottom:6px;pointer-events:none}
.bbin .blks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.blk{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;background:var(--card);border:1.5px solid var(--ink);font-weight:700;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;white-space:nowrap}
.blk.sel{background:var(--ink);color:var(--bg)}
.blk.dragging{opacity:.3}
.blk.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);box-shadow:var(--shadow);cursor:grabbing}
.blk.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.blk.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.blk .to{font-size:.72rem;font-weight:400}
.weak{display:flex;flex-wrap:wrap;gap:6px}
.weak span{font-size:.85rem;background:rgba(var(--heat),.18);border-radius:8px;padding:4px 10px}
.weak span b{font-variant-numeric:tabular-nums;margin-left:4px}
</style>
</head>

  const a=AC,t=a.currentTime+.01,o=a.createOscillator(),g=a.createGain();

  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(ok?.18:.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.3)}catch(e){}}

// ── 쓴 말 다듬기: 띄어쓰기·기호 빼고, 끝의 숫자는 수량. 제1·제2는 떼고 셈 ──
function parse(raw){let s=String(raw).trim().replace(/[×x*]\s*(\d+)\s*$/i,' $1').replace(/(\d+)\s*(대|개|명)\s*$/,'$1');
  let n=1;const m=s.match(/^(.*?)[\s]*(\d+)$/);if(m&&m[1]){s=m[1];n=Math.max(1,Math.min(9,+m[2]))}
  return {name:s.trim(),n}}
const norm=s=>String(s).replace(/[\s·.,()（）'"]/g,'').replace(/^제[12]/,'').toLowerCase();
function same(a,b){return norm(a)===norm(b)}
const names=g=>[g[0]].concat(g[1]||[]);

// ── 출제 ──
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const r=Math.random()*(i+1)|0;[a[i],a[r]]=[a[r],a[i]]}return a};
function weight(k){const r=S.items[k];return 1+(r?r.w*2-Math.min(r.n-r.w,3)*.2:1)}
function pick(pool,keyOf,k){const out=[],p=pool.slice();while(out.length<k&&p.length){const ws=p.map(x=>Math.max(.2,weight(keyOf(x)))),tot=ws.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot,i=0;while(r>ws[i]){r-=ws[i];i++}out.push(p.splice(Math.min(i,p.length-1),1)[0])}return shuffle(out)}
const ensPool=()=>DATA.ens.filter(e=>S.out||!e.out);
function build(mode,only){
  let pool,keyOf,mk;
  if(mode==='build'){pool=ensPool();keyOf=e=>'ens:'+e.id+':build';mk=e=>({key:keyOf(e),label:e.q,e,sec:Math.round(12+e.items.reduce((a,x)=>a+x[2],0)*5)})}
  if(mode==='fix'){pool=ensPool().filter(e=>e.traps.length&&e.items.some(x=>x[2]===1));keyOf=e=>'ens:'+e.id+':fix';
    mk=e=>{const cand=e.items.filter(x=>x[2]===1),rm=cand[Math.random()*cand.length|0],trap=e.traps[Math.random()*e.traps.length|0];
      const list=shuffle(e.items.filter(x=>x!==rm).map(x=>({t:x[0],n:x[2]})).concat([{t:trap,n:1,trap:1}]));
      return {key:keyOf(e),label:e.q,e,rm,trap,list,sec:25}}}
  if(mode==='score'){pool=DATA.scores;keyOf=s=>'score:'+s.img;mk=s=>({key:keyOf(s),label:s.q,s,ans:s.ans,sec:15+s.ans.length*6})}
  if(mode==='fact'){pool=DATA.facts;keyOf=f=>'fact:'+f.q;mk=f=>({key:keyOf(f),label:f.q,f,ans:f.ans,sec:12+f.ans.length*6})}
  if(mode==='sort'){pool=[];DATA.sorts.forEach(s=>Object.entries(s.map).forEach(([k,v])=>pool.push({s,inst:k,bin:v})));keyOf=x=>'sort:'+x.s.name+':'+x.inst;
    mk=x=>({key:keyOf(x),label:x.inst+' → '+x.s.name,x,sec:7})}
  if(mode==='board'){pool=DATA.sorts;keyOf=s=>'board:'+s.name;
    mk=s=>({key:keyOf(s),label:s.name+' 분류 판',s,sec:Math.round(15+Object.keys(s.map).length*4),place:{},order:shuffle(Object.keys(s.map))})}
  const src=only?pool.filter(x=>only.includes(keyOf(x))):pick(pool,keyOf,mode==='sort'?15:mode==='board'?4:ROUND);
  return src.map(mk)}

    document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{q.pickB=b.dataset.b;submit(false)})}

// ── 분류 판: 끌어 놓기(포인터) + 누르고 칸 누르기 ──
function blk(q,inst,res){const at=q.place[inst]||'',ok=res&&at===q.s.map[inst];
  return '<span class="blk'+(q.sel===inst&&!res?' sel':'')+(res?(ok?' right':' wrong'):'')+'" data-i="'+esc(inst)+'">'+esc(inst)+(res&&!ok?'<span class="to">→ '+esc(q.s.map[inst])+'</span>':'')+'</span>'}
function drawBoardSort(res){const q=G.qs[G.i];
  const tray=q.order.filter(i=>!q.place[i]);
  $('#bz').innerHTML='<div class="tray" data-b="">'+(tray.length?tray.map(i=>blk(q,i,res)).join(''):'<span class="hint">다 옮김</span>')+'</div>'
    +'<div class="bbins">'+q.s.bins.map(b=>'<div class="bbin" data-b="'+esc(b)+'"><h4>'+esc(b)+'</h4><div class="blks">'+q.order.filter(i=>q.place[i]===b).map(i=>blk(q,i,res)).join('')+'</div></div>').join('')+'</div>';
  if(res)return;
  $('#bz').querySelectorAll('.blk').forEach(el=>el.onpointerdown=e=>dragStart(e,el));
  $('#bz').querySelectorAll('.bbin,.tray').forEach(z=>z.onclick=e=>{if(e.target.closest('.blk'))return;if(q.sel)place(q.sel,z.dataset.b)})}
function place(inst,b){const q=G.qs[G.i];if(q.answered)return;if(b)q.place[inst]=b;else delete q.place[inst];q.sel=null;drawBoardSort()}
let DR=null;
function zoneAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.bbin,.tray'):null}
function dragStart(e,el){const q=G.qs[G.i];if(q.answered)return;e.preventDefault();
  DR={el,inst:el.dataset.i,x:e.clientX,y:e.clientY,moved:false,ghost:null,zone:null};
  const mv=ev=>{if(!DR)return;const dx=ev.clientX-DR.x,dy=ev.clientY-DR.y;
      if(!DR.moved&&Math.hypot(dx,dy)>6){DR.moved=true;DR.ghost=el.cloneNode(true);DR.ghost.classList.add('ghost');DR.ghost.classList.remove('sel');document.body.appendChild(DR.ghost);el.classList.add('dragging')}
      if(DR.moved){DR.ghost.style.left=ev.clientX+'px';DR.ghost.style.top=ev.clientY+'px';const z=zoneAt(ev.clientX,ev.clientY);
        if(z!==DR.zone){if(DR.zone)DR.zone.classList.remove('over');DR.zone=z;if(z)z.classList.add('over')}}},
    up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      const d=DR;DR=null;if(!d)return;if(d.ghost)d.ghost.remove();if(d.zone)d.zone.classList.remove('over');
      if(!d.moved){q.sel=q.sel===d.inst?null:d.inst;drawBoardSort();return}
      const z=zoneAt(ev.clientX,ev.clientY);if(z)place(d.inst,z.dataset.b);else drawBoardSort()};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
const chipBox=()=>'<div class="chips" id="ch"></div>';
const inp=ph=>'<form class="inp" id="fm" autocomplete="off"><input id="in" type="text" placeholder="'+ph+'" autocapitalize="off" spellcheck="false" enterkeyhint="enter"><button class="btn pri" type="submit">제출</button></form>';
function drawChips(){const c=$('#ch');if(!c)return;const q=G.qs[G.i];
  c.innerHTML=q.chips.map((x,i)=>'<span class="chip">'+esc(x.name)+(x.n>1?'<span class="n">×'+x.n+'</span>':'')+'<button type="button" data-i="'+i+'" aria-label="빼기">×</button></span>').join('');
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{q.chips.splice(+b.dataset.i,1);drawChips();$('#in').focus()})}
function wireChips(){const q=G.qs[G.i],single=(G.mode==='score'||G.mode==='fact')&&q.ans.length===1;
  $('#fm').onsubmit=e=>{e.preventDefault();if(q.answered)return;const raw=$('#in').value.trim();
    if(!raw){if(q.chips.length)submit(false);return}
    if(single){q.chips=[parse(raw)];submit(false);return}
    raw.split(/[,，、]/).map(s=>s.trim()).filter(Boolean).forEach(r=>{const p=parse(r);const ex=q.chips.find(c=>same(c.name,p.name));if(ex)ex.n+=p.n;else q.chips.push(p)});
    $('#in').value='';drawChips()};
  const sb=$('#sub');if(sb)sb.onclick=()=>{const raw=$('#in').value.trim();if(raw){$('#fm').requestSubmit?$('#fm').requestSubmit():$('#fm').onsubmit(new Event('submit'))}submit(false)}}
// 한 칸에 쓴 것을 악기 목록으로: 띄어쓰기·쉼표로 자르고, 숫자·"두 대"는 앞 악기의 수량, 띄어 쓴 이름은 붙여 본다
const KNOWN=new Set();
DATA.ens.forEach(e=>{e.items.forEach(x=>names(x).forEach(n=>KNOWN.add(norm(n))));(e.opt||[]).concat(e.traps).forEach(n=>KNOWN.add(norm(n)))});
DATA.scores.concat(DATA.facts).forEach(x=>x.ans.forEach(a=>a.forEach(n=>KNOWN.add(norm(n)))));
function tokenize(raw){
  const s=String(raw).replace(/[×xX*]\s*(\d)/g,' $1').replace(/(\d)\s*(대|개|명)(?=$|[\s,，、·])/g,'$1')
    .replace(/(^|[\s,，、·])(둘|두\s*대)(?=$|[\s,，、·])/g,' 2').replace(/(^|[\s,，、·])(셋|세\s*대)(?=$|[\s,，、·])/g,' 3');
  const t=s.split(/[\s,，、·;/]+/).filter(Boolean),out=[];
  for(let i=0;i<t.length;i++){let w=t[i];
    if(/^\d+$/.test(w)){if(out.length)out[out.length-1].n=Math.max(1,Math.min(9,+w));continue}
    let n=1;const m=w.match(/^(.*?)(\d+)$/);if(m&&m[1]){w=m[1];n=Math.max(1,Math.min(9,+m[2]))}
    if(i+1<t.length&&!KNOWN.has(norm(w))&&KNOWN.has(norm(w+t[i+1]))){w=w+t[i+1];i++}
    const ex=out.find(c=>same(c.name,w));if(ex)ex.n+=n;else out.push({name:w,n})}
  return out}
function wireType(){const q=G.qs[G.i];
  $('#fm').onsubmit=e=>{e.preventDefault();if(q.answered)return;const raw=$('#in').value.trim();if(!raw){shake();return}q.chips=tokenize(raw);submit(false)}}
function shake(){const c=$('#cd');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
function startTimer(){const q=G.qs[G.i];q.t0=Date.now();const bar=$('#tm i'),tm=$('#tm');
  timerId=setInterval(()=>{const left=Math.max(0,1-(Date.now()-q.t0)/1000/q.sec);if(bar)bar.style.transform='scaleX('+left+')';if(tm)tm.classList.toggle('low',left<.3);
    if(left<=0){clearInterval(timerId);const v=$('#in')?$('#in').value.trim():'';if(v){if(G.mode==='fix')q.typed=v;else q.chips=tokenize(v)}submit(true)}},100)}
// 정답 묶음(이름·다른 이름·수)과 쓴 칩 대조
function grade(groups,opt,chips){const used=chips.map(()=>0),res=groups.map(g=>{let got=0;chips.forEach((c,i)=>{if(names(g).some(nm=>same(nm,c.name))){got+=c.n;used[i]=1}});return {g,got}});
  const optUsed=chips.map((c,i)=>!used[i]&&(opt||[]).some(o=>same(o,c.name)));
  const extra=chips.filter((c,i)=>!used[i]&&!optUsed[i]);
  const ok=res.every(r=>r.got===r.g[2])&&!extra.length;
  return {ok,res,extra,chips:chips.map((c,i)=>({c,st:used[i]?(res.find(r=>names(r.g).some(nm=>same(nm,c.name))).got===res.find(r=>names(r.g).some(nm=>same(nm,c.name))).g[2]?'right':'wrong'):optUsed[i]?'opt':'wrong'}))}}
function submit(timeout){const q=G.qs[G.i];if(q.answered)return;q.answered=true;clearInterval(timerId);
  const m=G.mode;let ok=false,show='';
  if(m==='build'||m==='score'||m==='fact'){
    const groups=m==='build'?q.e.items:q.ans.map(a=>[a[0],a.slice(1),1]);
    const r=grade(groups,m==='build'?q.e.opt:null,q.chips);ok=r.ok&&!(timeout&&!q.chips.length);
    show='<div class="cap">내가 쓴 것</div><div class="chips">'+(r.chips.length?r.chips.map(x=>'<span class="chip '+x.st+'">'+esc(x.c.name)+(x.c.n>1?'<span class="n">×'+x.c.n+'</span>':'')+'</span>').join(''):'<span class="hint">없음</span>')+'</div>'
      +'<div class="cap">정답</div><div class="chips">'+r.res.map(x=>'<span class="chip '+(x.got===x.g[2]?'right':'miss')+'">'+esc(x.g[0])+(x.g[2]>1?'<span class="n">×'+x.g[2]+'</span>':'')+'</span>').join('')
      +(m==='build'&&q.e.opt?q.e.opt.map(o=>'<span class="chip opt">'+esc(o)+'</span>').join(''):'')+'</div>'
      +(m==='build'?'<div class="note">'+esc(q.e.note)+(q.e.note?' · ':'')+esc(q.e.src)+'</div>':m==='fact'?'<div class="note">'+esc(q.f.src)+'</div>':'')}
  if(m==='fix'){const pickT=q.sel!==null?q.list[q.sel]:null;const okPick=!!(pickT&&pickT.trap),okType=!!(q.typed&&names(q.rm).some(nm=>same(nm,parse(q.typed).name)));
    ok=okPick&&okType&&!timeout;
    show='<div class="chips">'+q.list.map((x,i)=>'<span class="chip '+(x.trap?'wrong':(i===q.sel?'sel':''))+'">'+esc(x.t)+(x.n>1?'<span class="n">×'+x.n+'</span>':'')+'</span>').join('')+'<span class="chip right">'+esc(q.rm[0])+'</span></div>'
      +'<div class="note">'+esc(q.trap)+' → '+esc(q.rm[0])+' · 내 답: '+esc(pickT?pickT.t:'고르지 않음')+' → '+esc(q.typed||'안 씀')+'</div><div class="note">'+esc(q.e.note)+' · '+esc(q.e.src)+'</div>'}
  if(m==='board'){const insts=q.order;let right=0;insts.forEach(i=>{const r=q.place[i]===q.s.map[i];if(r)right++;rec('sort:'+q.s.name+':'+i,r,i+' → '+q.s.name)});
    ok=right===insts.length;q.right=right;drawBoardSort(true);show='<div class="note">'+right+' / '+insts.length+' 맞힘</div>'}
  if(m==='sort'){ok=!timeout&&q.pickB===q.x.bin;document.querySelectorAll('.bin').forEach(b=>{b.disabled=true;if(b.dataset.b===q.x.bin)b.classList.add('right');else if(b.dataset.b===q.pickB)b.classList.add('wrong')})}
  const left=Math.max(0,1-(Date.now()-q.t0)/1000/q.sec);
  if(m==='board')G.score+=(q.right||0)*20;
  if(ok){G.combo++;G.maxc=Math.max(G.maxc,G.combo);G.right++;G.score+=Math.round((100+left*100)*Math.min(2,1+.1*(G.combo-1)))}
  else{G.combo=0;G.lives--;G.wrong.push(q)}
  rec(q.key,ok,q.label);sfx(ok);
  const f=$('#fm');if(f)f.remove();const sb=$('#sub');if(sb)sb.parentNode.remove();
  if(m==='board'&&$('#sub'))$('#sub').closest('.row').remove();
  if(m!=='sort'){const ch=$('#ch');if(ch)ch.remove();const fl=$('#fl');if(fl)fl.remove()}
  const fb=$('#fb');fb.className='fb '+(ok?'ok':'no');fb.innerHTML=ok?'정답':(timeout?'시간 끝':'오답');
  $('#after').innerHTML=show+'<div class="row"><button class="btn pri" id="nx">'+(G.i+1>=G.qs.length||G.lives<=0?'결과':'다음')+'</button></div>';
  $('#nx').onclick=()=>{G.i++;next()};$('#nx').focus();
  const hd=document.querySelector('.hud');if(hd){const t=document.createElement('div');t.innerHTML=hud();hd.replaceWith(t.firstChild);$('#quit').onclick=home;$('#tm i').style.transform='scaleX(0)'}}
function result(){clearInterval(timerId);const g=G,m=g.m;const prev=S.best[m.id]||0,nb=g.score>prev;if(nb){S.best[m.id]=g.score;save()}
  let h='<div style="padding-top:28px"><div class="card"><div class="ask" style="text-align:center">'+m.t+(g.lives<=0?' · 목숨 끝':'')+'</div><div class="big">'+g.score+'</div>'
   +(nb?'<div class="newbest">최고 기록</div>':'')+'<div class="stats"><span>맞힘 <b>'+g.right+'</b> / '+(g.right+g.wrong.length)+'</span><span>최대 콤보 <b>'+g.maxc+'</b></span><span>최고 <b>'+(S.best[m.id]||0)+'</b></span></div>'
   +'<div class="row"><button class="btn pri" id="again">'+I.redo+'한 판 더</button>'+(g.wrong.length?'<button class="btn" id="wr">틀린 것만 '+g.wrong.length+'</button>':'')+'<button class="btn" id="hm">처음으로</button></div>';
  if(g.wrong.length)h+='<div class="rv">'+g.wrong.map(q=>'<div class="rvitem"><div class="t">'+esc(q.label)+'</div><div class="src">'+esc(answerText(q))+'</div></div>').join('')+'</div>';
  $('#app').innerHTML=h+'</div></div>';
  $('#again').onclick=()=>start(m.id);$('#hm').onclick=home;if($('#wr'))$('#wr').onclick=()=>start(m.id,g.wrong.map(q=>q.key))}
function answerText(q){if(q.e&&G.mode==='build')return q.e.items.map(x=>x[0]+(x[2]>1?' ×'+x[2]:'')).join(' · ')+(q.e.opt?' (+'+q.e.opt.join('·')+')':'');
  if(q.e)return q.trap+' → '+q.rm[0];if(q.ans)return q.ans.map(a=>a[0]).join(' · ');if(q.x)return q.x.inst+' = '+q.x.bin;if(q.s&&q.s.map)return q.s.bins.map(b=>b+': '+Object.keys(q.s.map).filter(i=>q.s.map[i]===b).join('·')).join(' / ');return ''}
document.addEventListener('keydown',e=>{if(!G)return;
  if(G.mode==='sort'&&!G.qs[G.i]?.answered){const n=+e.key;const b=document.querySelectorAll('.bin')[n-1];if(n>=1&&b){b.click();return}}
  if(e.key==='Enter'&&!e.isComposing){const nx=$('#nx');if(nx&&document.activeElement!==nx){e.preventDefault();nx.click()}}});
if(!EMB)home();else setTimeout(()=>{if(!G&&!$('header'))home()},1500);
</script>
